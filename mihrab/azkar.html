<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function() {
      const theme = localStorage.getItem('user_theme') || 'light';
      document.documentElement.setAttribute('data-theme-mode', theme);
      document.documentElement.setAttribute('data-bs-theme', (theme === 'black' || theme === 'dark') ? 'dark' : 'light');
      if (theme === 'black') {
        document.documentElement.style.backgroundColor = '#000000';
      } else if (theme === 'dark') {
        document.documentElement.style.backgroundColor = '#121212';
      } else {
        document.documentElement.style.backgroundColor = '#1b4332';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محراب | الأذكار اليومية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top" id="main-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="./images/logo.png.png" alt="شعار محراب" width="40" height="40" class="d-inline-block align-text-top rounded-circle object-fit-cover shadow-sm">
        <span class="fw-bold fs-4 text-brand">مِـحْـرَاب</span>
      </a>

      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-palette"></i>
            <span class="d-none d-sm-inline ms-1">المظهر</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><button class="dropdown-item" type="button" onclick="setTheme('light')"><i class="bi bi-sun me-2"></i>فاتح</button></li>
            <li><button class="dropdown-item" type="button" onclick="setTheme('dark')"><i class="bi bi-moon-stars me-2"></i>داكن</button></li>
            <li><button class="dropdown-item" type="button" onclick="setTheme('black')"><i class="bi bi-circle-fill me-2"></i>أسود كامل</button></li>
          </ul>
        </div>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="azkar.html">الأذكار اليومية</a></li>
          <li class="nav-item"><a class="nav-link" href="tasbeeh.html">السبحة الإلكترونية</a></li>
          <li class="nav-item"><a class="nav-link" href="quran.html">القرآن الكريم</a></li>
          <li class="nav-item"><a class="nav-link" href="tracker.html">مُنظّم الأوراد</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">المعرض والخلفيات</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-5 flex-grow-1">
    <div class="container" style="max-width: 900px;">
      
      <div class="text-center mb-4">
        <h2 class="fw-bold title-text mb-1">الأذكار اليومية</h2>
        <p class="sub-text small">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</p>
      </div>

      <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap" id="azkar-tabs">
        <button class="btn btn-outline-brand rounded-pill px-3 active tab-btn" onclick="switchCategory('sabah')">
          <i class="bi bi-sun-fill me-1"></i> أذكار الصباح
        </button>
        <button class="btn btn-outline-brand rounded-pill px-3 tab-btn" onclick="switchCategory('masaa')">
          <i class="bi bi-moon-stars-fill me-1"></i> أذكار المساء
        </button>
        <button class="btn btn-outline-brand rounded-pill px-3 tab-btn" onclick="switchCategory('sleep')">
          <i class="bi bi-cloud-moon-fill me-1"></i> أذكار النوم
        </button>
        <button class="btn btn-outline-brand rounded-pill px-3 tab-btn" onclick="switchCategory('wake')">
          <i class="bi bi-sunrise-fill me-1"></i> أذكار الاستيقاظ
        </button>
      </div>

      <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h5 class="fw-bold text-brand mb-0" id="current-category-title">أذكار الصباح</h5>
            <small class="text-muted" id="category-progress-text">المنجز: 0 / 0</small>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-brand rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#addZekrModal">
              <i class="bi bi-plus-circle me-1"></i> إضافة ذكر لهذا القسم
            </button>
            <button class="btn btn-sm btn-light rounded-pill px-3 border" onclick="resetCurrentCategoryCounters()">
              <i class="bi bi-arrow-counterclockwise me-1"></i> تصفير عدادات القسم
            </button>
          </div>
        </div>
      </div>

      <div id="azkar-cards-container" class="d-flex flex-column gap-3"></div>

    </div>
  </main>

  <div class="modal fade" id="addZekrModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-brand">إضافة ذكر جديد للقسم</h5>
          <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label small fw-bold">نص الذكر:</label>
            <textarea id="modalZekrText" class="form-control rounded-3" rows="3" placeholder="اكتب نص الذكر هنا..."></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">عدد التكرار:</label>
            <input type="number" id="modalZekrCount" class="form-control rounded-3 text-center" value="1" min="1" max="1000">
          </div>
          <button type="button" class="btn btn-brand w-100 rounded-pill py-2" onclick="saveNewCategoryZekr()">حفظ الذكر</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    جميع الحقوق محفوظة &copy; 2026 - مِـحْـرَاب
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script src="azkar.js"></script>
</body>
</html>
