<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محراب | المعرض والخلفيات</title>
  <script>
    (function() {
      const t = localStorage.getItem('user_theme') || 'light';
      document.documentElement.setAttribute('data-theme-mode', t);
      document.documentElement.setAttribute('data-bs-theme', (t === 'black' || t === 'dark') ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top" id="main-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="./images/logo.png.png" alt="شعار محراب" width="40" height="40" class="d-inline-block align-text-top rounded-circle object-fit-cover shadow-sm">
        <span class="fw-bold fs-4 text-brand">مِـحْـرَاب</span>
      </a>

      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-palette"></i>
            <span class="d-none d-sm-inline ms-1">المظهر</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><button class="dropdown-item" type="button" onclick="setTheme('light')"><i class="bi bi-sun me-2"></i>فاتح</button></li>
            <li><button class="dropdown-item" type="button" onclick="setTheme('dark')"><i class="bi bi-moon-stars me-2"></i>داكن</button></li>
            <li><button class="dropdown-item" type="button" onclick="setTheme('black')"><i class="bi bi-circle-fill me-2"></i>أسود كامل</button></li>
          </ul>
        </div>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="azkar.html">الأذكار اليومية</a></li>
          <li class="nav-item"><a class="nav-link" href="tasbeeh.html">السبحة الإلكترونية</a></li>
          <li class="nav-item"><a class="nav-link" href="quran.html">القرآن الكريم</a></li>
          <li class="nav-item"><a class="nav-link" href="tracker.html">مُنظّم الأوراد</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="gallery.html">المعرض والخلفيات</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <div class="text-center mb-5">
      <h2 class="fw-bold text-brand">معرض الخلفيات</h2>
      <p class="text-muted">اختر المظهر الافتراضي أو إحدى الخلفيات المخصصة للموقع</p>
    </div>

    <div class="row g-4 justify-content-center">
      
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden border-top border-4 border-success">
          <div class="d-flex align-items-center justify-content-center bg-light text-brand" style="height: 220px;">
            <i class="bi bi-arrow-counterclockwise display-3 text-success"></i>
          </div>
          <div class="card-body p-3">
            <button class="btn btn-brand btn-sm rounded-pill w-100 py-2" onclick="resetToDefaultBackground()">استعادة الافتراضي</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
          <img src="./images/makkah.jpg" class="card-img-top object-fit-cover" height="220" alt="خلفية مكة">
          <div class="card-body p-3">
            <button class="btn btn-outline-brand btn-sm rounded-pill w-100 py-2" onclick="applyCustomBackground('./images/makkah.jpg')">تعيين كخلفية</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
          <img src="./images/madina.jpg" class="card-img-top object-fit-cover" height="220" alt="خلفية المدينة">
          <div class="card-body p-3">
            <button class="btn btn-outline-brand btn-sm rounded-pill w-100 py-2" onclick="applyCustomBackground('./images/madina.jpg')">تعيين كخلفية</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
          <img src="./images/aqsa.jpg" class="card-img-top object-fit-cover" height="220" alt="خلفية الأقصى">
          <div class="card-body p-3">
            <button class="btn btn-outline-brand btn-sm rounded-pill w-100 py-2" onclick="applyCustomBackground('./images/aqsa.jpg')">تعيين كخلفية</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
          <img src="./images/red.png" class="card-img-top object-fit-cover" height="220" alt="خلفية حمراء">
          <div class="card-body p-3">
            <button class="btn btn-outline-brand btn-sm rounded-pill w-100 py-2" onclick="applyCustomBackground('./images/red.png')">تعيين كخلفية</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
          <img src="./images/green.png" class="card-img-top object-fit-cover" height="220" alt="خلفية خضراء">
          <div class="card-body p-3">
            <button class="btn btn-outline-brand btn-sm rounded-pill w-100 py-2" onclick="applyCustomBackground('./images/green.png')">تعيين كخلفية</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
          <img src="./images/blue.png" class="card-img-top object-fit-cover" height="220" alt="خلفية زرقاء">
          <div class="card-body p-3">
            <button class="btn btn-outline-brand btn-sm rounded-pill w-100 py-2" onclick="applyCustomBackground('./images/blue.png')">تعيين كخلفية</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    جميع الحقوق محفوظة &copy; 2026 - مِـحْـرَاب
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    function applyCustomBackground(url) {
      if (localStorage.getItem('user_theme') === 'black') {
        localStorage.setItem('user_theme', 'dark');
      }
      localStorage.setItem('userBgType', 'image');
      localStorage.setItem('userBgValue', url);
      window.location.href = 'index.html';
    }

    function resetToDefaultBackground() {
      localStorage.removeItem('userBgType');
      localStorage.removeItem('userBgValue');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
