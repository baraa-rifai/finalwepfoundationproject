<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function() {
      const theme = localStorage.getItem('user_theme') || 'light';
      document.documentElement.setAttribute('data-theme-mode', theme);
      document.documentElement.setAttribute('data-bs-theme', (theme === 'black' || theme === 'dark') ? 'dark' : 'light');
      if (theme === 'black') {
        document.documentElement.style.backgroundColor = '#000000';
      } else if (theme === 'dark') {
        document.documentElement.style.backgroundColor = '#121212';
      } else {
        document.documentElement.style.backgroundColor = '#1b4332';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محراب | القرآن الكريم</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 position-relative">

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top" id="main-navbar">
    <div class="container-fluid px-3 px-md-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="./images/logo.png.png" alt="شعار محراب" width="40" height="40" class="d-inline-block align-text-top rounded-circle object-fit-cover shadow-sm">
        <span class="fw-bold fs-4 text-brand">مِـحْـرَاب</span>
      </a>

      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-palette"></i>
            <span class="d-none d-sm-inline ms-1">المظهر</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><button class="dropdown-item" type="button" onclick="setTheme('light')"><i class="bi bi-sun me-2"></i>فاتح</button></li>
            <li><button class="dropdown-item" type="button" onclick="setTheme('dark')"><i class="bi bi-moon-stars me-2"></i>داكن</button></li>
            <li><button class="dropdown-item" type="button" onclick="setTheme('black')"><i class="bi bi-circle-fill me-2"></i>أسود كامل</button></li>
          </ul>
        </div>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="azkar.html">الأذكار اليومية</a></li>
          <li class="nav-item"><a class="nav-link" href="tasbeeh.html">السبحة الإلكترونية</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="quran.html">القرآن الكريم</a></li>
          <li class="nav-item"><a class="nav-link" href="tracker.html">مُنظّم الأوراد</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">المعرض والخلفيات</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="bg-white border-bottom py-2 px-3 shadow-sm" id="bookmark-bar">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2">
      
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-brand rounded-pill px-3 d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#surahIndexModal">
          <i class="bi bi-list-ul"></i>
          <span>فهرس السور</span>
        </button>

        <button class="btn btn-sm btn-outline-brand rounded-pill px-3 d-flex align-items-center gap-1" onclick="goToBookmark()" title="الانتقال إلى آخر علامة">
          <i class="bi bi-bookmark-fill text-warning"></i>
          <span id="bookmarkReminderText">الفاصلة المحفوظة</span>
        </button>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="prevPage()">
          <i class="bi bi-arrow-right"></i> السابقة
        </button>
        
        <div class="d-flex align-items-center gap-1">
          <input type="number" id="directPageInput" min="1" max="604" class="form-control form-control-sm text-center font-monospace rounded-pill" style="width: 75px;" value="1">
          <button class="btn btn-sm btn-brand rounded-pill px-2" onclick="jumpToPageInput()">انتقال</button>
        </div>

        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="nextPage()">
          التالية <i class="bi bi-arrow-left"></i>
        </button>
      </div>

      <form onsubmit="saveCustomBookmark(event)" class="d-flex align-items-center gap-2 mb-0">
        <div class="input-group input-group-sm" style="width: 140px;">
          <span class="input-group-text bg-light small">آية</span>
          <input type="number" id="ayahBookmarkInput" min="1" max="286" class="form-control text-center font-monospace" placeholder="رقم" required>
        </div>
        <button type="submit" class="btn btn-sm btn-brand rounded-pill px-3 d-flex align-items-center gap-1">
          <i class="bi bi-bookmark-check-fill text-warning"></i>
          <span>تثبيت الفاصلة</span>
        </button>
      </form>

    </div>
  </div>

  <main class="flex-grow-1 py-4 d-flex justify-content-center align-items-start position-relative">
    
    <button class="btn-side-nav side-prev" onclick="prevPage()" title="الصفحة السابقة (سهم يمين)">
      <i class="bi bi-chevron-right fs-4"></i>
    </button>
    <button class="btn-side-nav side-next" onclick="nextPage()" title="الصفحة التالية (سهم يسار)">
      <i class="bi bi-chevron-left fs-4"></i>
    </button>

    <div class="container" style="max-width: 820px;">
      
      <div class="card border-0 shadow rounded-4 p-4 p-md-5 quran-page-card">
        
        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
          <span class="fw-bold text-brand fs-5" id="surahHeaderName">سورة الفاتحة</span>
          <span class="badge bg-light text-dark border font-monospace fs-6 px-3 py-1" id="juzHeader">الجزء 1</span>
        </div>

        <div id="pageLoader" class="text-center py-5 d-none">
          <div class="spinner-border text-success" role="status"></div>
          <p class="small text-muted mt-2">جاري تحميل الصفحة الكريمة...</p>
        </div>

        <div id="quranTextContainer" class="quran-text-body font-amiri text-center leading-loose">
        </div>

        <div class="border-top pt-3 mt-4 text-center">
          <span class="font-monospace fw-bold text-muted small" id="pageNumberFooter">1</span>
        </div>

      </div>

    </div>
  </main>

  <div class="modal fade" id="surahIndexModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header border-0 pb-2">
          <h5 class="modal-title fw-bold text-brand d-flex align-items-center gap-2">
            <i class="bi bi-book-half"></i>
            <span>فهرس سور القرآن الكريم (114 سورة)</span>
          </h5>
          <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-1">
          <div class="mb-3">
            <input type="text" id="surahSearchInput" class="form-control rounded-pill px-3" placeholder="ابحث عن اسم السورة..." oninput="filterSurahIndex()">
          </div>
          <div class="row g-2" id="surahIndexListContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    جميع الحقوق محفوظة &copy; 2026 - مِـحْـرَاب
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script src="quran.js"></script>
</body>
</html>
