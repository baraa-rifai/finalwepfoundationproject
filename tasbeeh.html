<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function() {
      const theme = localStorage.getItem('user_theme') || 'light';
      document.documentElement.setAttribute('data-theme-mode', theme);
      document.documentElement.setAttribute('data-bs-theme', (theme === 'black' || theme === 'dark') ? 'dark' : 'light');
      if (theme === 'black') {
        document.documentElement.style.backgroundColor = '#000000';
      } else if (theme === 'dark') {
        document.documentElement.style.backgroundColor = '#121212';
      } else {
        document.documentElement.style.backgroundColor = '#1b4332';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محراب | السبحة الإلكترونية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top" id="main-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="./images/logo.png.png" alt="شعار محراب" width="40" height="40" class="d-inline-block align-text-top rounded-circle object-fit-cover shadow-sm">
        <span class="fw-bold fs-4 text-brand">مِـحْـرَاب</span>
      </a>

      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-palette"></i>
            <span class="d-none d-sm-inline ms-1">المظهر</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><button class="dropdown-item" type="button" onclick="setTheme('light')"><i class="bi bi-sun me-2"></i>فاتح</button></li>
            <li><button class="dropdown-item" type="button" onclick="setTheme('dark')"><i class="bi bi-moon-stars me-2"></i>داكن</button></li>
            <li><button class="dropdown-item" type="button" onclick="setTheme('black')"><i class="bi bi-circle-fill me-2"></i>أسود كامل</button></li>
          </ul>
        </div>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="azkar.html">الأذكار اليومية</a></li>
          <li class="nav-item"><a class="nav-link active fw-bold" href="tasbeeh.html">السبحة الإلكترونية</a></li>
          <li class="nav-item"><a class="nav-link" href="quran.html">القرآن الكريم</a></li>
          <li class="nav-item"><a class="nav-link" href="tracker.html">مُنظّم الأوراد</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">المعرض والخلفيات</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-5 flex-grow-1 d-flex flex-column justify-content-center">
    <div class="container text-center" style="max-width: 500px;">
      
      <div class="mb-4">
        <h2 class="fw-bold title-text mb-1">السبحة الإلكترونية</h2>
        <p class="sub-text small">وَاذْكُر رَّبَّكَ كَثِيرًا</p>
      </div>

      <div class="card border-0 shadow-lg rounded-5 p-4 bg-white">
        
        <div class="mb-3">
          <div class="input-group mb-2">
            <select id="zekrList" class="form-select text-center fw-bold rounded-start-pill shadow-none">
              <option value="سُبْحَانَ اللَّهِ">سُبْحَانَ اللَّهِ</option>
              <option value="الْحَمْدُ لِلَّهِ">الْحَمْدُ لِلَّهِ</option>
              <option value="اللَّهُ أَكْبَرُ">اللَّهُ أَكْبَرُ</option>
            </select>
            <button id="editZekrBtn" class="btn btn-outline-secondary px-3" type="button" title="تعديل الذكر المختار">
              <i class="bi bi-pencil"></i>
            </button>
            <button id="deleteZekrBtn" class="btn btn-outline-danger rounded-end-pill px-3" type="button" title="حذف الذكر المختار">
              <i class="bi bi-trash"></i>
            </button>
          </div>

          <div class="input-group input-group-sm">
            <input type="text" id="customZekrInput" class="form-control rounded-start-pill text-center shadow-none" placeholder="أضف ذِكر جديد...">
            <button id="addZekrBtn" class="btn btn-brand rounded-end-pill px-3" type="button">إضافة</button>
          </div>
        </div>

        <div class="my-2">
          <h4 id="zekrTitle" class="fw-bold font-amiri mb-0">سُبْحَانَ اللَّهِ</h4>
        </div>

        <div class="d-flex justify-content-center gap-2 my-3">
          <button type="button" class="btn btn-sm rounded-pill px-3 target-btn active" data-target="33">33</button>
          <button type="button" class="btn btn-sm rounded-pill px-3 target-btn" data-target="100">100</button>
          <button type="button" class="btn btn-sm rounded-pill px-3 target-btn" data-target="0">غير محدود</button>
        </div>

        <div class="d-flex justify-content-center my-3">
          <button id="tasbeeh-btn" type="button" class="btn rounded-circle d-flex flex-column align-items-center justify-content-center" style="width: 200px; height: 200px;">
            <span id="countText" class="display-3 fw-bold font-monospace">0</span>
            <small id="targetStatusText" class="mt-1">الهدف: 33</small>
          </button>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <div class="p-2 border rounded-4 tasbeeh-stat-box">
              <small class="d-block">مجموع التسبيح</small>
              <span id="totalText" class="fw-bold fs-5 font-monospace">0</span>
            </div>
          </div>
          <div class="col-6">
            <div class="p-2 border rounded-4 tasbeeh-stat-box">
              <small class="d-block">الدورات المكتملة</small>
              <span id="roundsText" class="fw-bold fs-5 font-monospace">0</span>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-center gap-2">
          <button id="resetBtn" class="btn rounded-pill px-3 shadow-sm d-flex align-items-center gap-1">
            <i class="bi bi-arrow-counterclockwise"></i>
            <span>تصفير العداد</span>
          </button>
          <button id="resetAllBtn" class="btn btn-outline-danger rounded-pill px-3 shadow-sm d-flex align-items-center gap-1">
            <i class="bi bi-trash3"></i>
            <span>مسح الكل</span>
          </button>
        </div>

      </div>

    </div>
  </main>

  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    جميع الحقوق محفوظة &copy; 2026 - مِـحْـرَاب
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script src="tasbeeh.js"></script>
</body>
</html>
